name: Publish game

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build game
    runs-on: ubuntu-latest
    outputs:
      pages_artifact_id: ${{ steps.upload.outputs.artifact_id }}
    steps:
      - name: Checkout sources
        uses: actions/checkout@v7.0.1
      - name: Setup Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Test game
        run: npm test
      - name: Build static site
        run: npm run build
      - name: Upload built site
        id: upload
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          name: github-pages
          path: dist
          retention-days: 7
      - name: Verify upload completed
        env:
          PAGES_ARTIFACT_ID: ${{ steps.upload.outputs.artifact_id }}
        run: test -n "$PAGES_ARTIFACT_ID"

  deploy:
    name: Publish to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6.0.0
      - name: Deploy built site
        id: deployment
        uses: actions/deploy-pages@v5.0.1
        with:
          artifact_name: github-pages
